<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glassy Effect</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            z-index: 1;
        }

        .glass-shape {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .shape1 {
            width: 400px;
            height: 400px;
            top: -100px;
            left: -100px;
            background: linear-gradient(135deg, rgba(100, 200, 255, 0.3), rgba(150, 100, 255, 0.2));
        }

        .shape2 {
            width: 500px;
            height: 500px;
            top: 20%;
            right: -150px;
            background: linear-gradient(225deg, rgba(120, 100, 255, 0.3), rgba(200, 150, 255, 0.2));
        }

        .shape3 {
            width: 350px;
            height: 350px;
            bottom: -100px;
            left: 30%;
            background: linear-gradient(45deg, rgba(150, 180, 255, 0.25), rgba(100, 150, 255, 0.15));
        }

        .content {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            padding: 2rem;
            flex-wrap: wrap;
        }

        .card {
            width: 280px;
            height: 180px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 2rem;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .card:hover {
            transform: translateY(-10px) scale(1.02);
            background: rgba(255, 255, 255, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.2);
        }

        .card h3 {
            color: white;
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .card p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.95rem;
            text-align: center;
            line-height: 1.5;
        }

        .icon {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            transition: all 0.3s ease;
        }

        .card:hover .icon {
            transform: scale(1.1) rotate(5deg);
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <div class="background">
        <div class="glass-shape shape1"></div>
        <div class="glass-shape shape2"></div>
        <div class="glass-shape shape3"></div>
    </div>

    <div class="content">
        <div class="card">
            <div class="icon">✨</div>
            <h3>Design</h3>
            <p>Beautiful glassmorphism effects</p>
        </div>

        <div class="card">
            <div class="icon">🎨</div>
            <h3>Style</h3>
            <p>Modern and elegant UI</p>
        </div>

        <div class="card">
            <div class="icon">🚀</div>
            <h3>Create</h3>
            <p>Build amazing experiences</p>
        </div>
    </div>
</body>
</html>
